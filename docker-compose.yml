services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8088:80"
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      API_PORT: 3001
      WEB_ORIGIN: http://localhost:8088
      PRICING_SERVICE_URL: http://pricing:8080
      WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-551636107700}
      DELIVERY_FEE_CENTS: ${DELIVERY_FEE_CENTS:-1500}
    ports:
      - "3001:3001"
    depends_on:
      pricing:
        condition: service_healthy

  pricing:
    build: ./services/pricing
    environment:
      DELIVERY_FEE_CENTS: ${DELIVERY_FEE_CENTS:-1500}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 8
